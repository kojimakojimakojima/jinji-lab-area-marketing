<!-- BlueMonkey ページ個別設定 > その他の<head>領域へ -->
<style>
.hrlp{--ink:#162641;--navy:#142746;--body:#39495e;--muted:#65758a;--yellow:#ffdb31;--yellow2:#f9ce18;--cta:#C73438;--cta-hover:#AA292E;--line:#e4e9ee;--soft:#f6f9fb;--ice:#eff7ff;--warm:#fffdf5;--max:1180px;--radius:10px}
.hrlp, .hrlp *{box-sizing:border-box}
.hrlp{margin:0;color:var(--ink);font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,Arial,sans-serif;font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased}
.hrlp a{text-decoration:none;color:inherit}
.hrlp button,.hrlp input,.hrlp textarea{font:inherit}
.hrlp button{cursor:pointer}
.hrlp a:focus-visible,.hrlp button:focus-visible,.hrlp input:focus-visible,.hrlp textarea:focus-visible,.hrlp summary:focus-visible{outline:3px solid #d39b00;outline-offset:4px}
.hrlp ::selection{background:#ffdf53;color:#15253c}
.hrlp .container{width:min(calc(100% - 96px),var(--max));margin:auto}
.hrlp header{position:sticky;top:0;z-index:100;height:76px;background:rgba(255,255,255,.97);border-bottom:1px solid #e9edf2;backdrop-filter:blur(10px)}
.hrlp .head{height:100%;display:flex;align-items:center;gap:24px}
.hrlp .brand{font-weight:900;font-size:26px;color:#14233d;letter-spacing:-.08em;white-space:nowrap;line-height:1.1}
.hrlp .brand i{display:inline-block;width:8px;height:8px;background:var(--yellow);vertical-align:bottom;margin:0 0 3px 6px}
.hrlp .brand-note{border-left:1px solid #d9e0e7;padding-left:14px;font-size:11px;line-height:1.35;font-weight:700;color:#738092;white-space:nowrap}
.hrlp .nav{margin-left:auto;display:flex;align-items:center;gap:27px;font-size:13px;font-weight:700}
.hrlp .nav a:hover:not(.btn){color:#006eaa}
.hrlp .btn{border:0;display:inline-flex;align-items:center;justify-content:center;gap:18px;padding:14px 26px;min-height:54px;border-radius:100px;background:var(--cta);color:#fff;font-weight:800;font-size:15px;white-space:nowrap;box-shadow:0 9px 21px rgba(169,41,46,.17);transition:transform .15s ease,background .15s ease}
.hrlp .btn:hover{background:var(--cta-hover);transform:translateY(-1px)}
.hrlp .btn .arrow{font-size:20px;font-weight:400;line-height:1}
.hrlp .nav .btn{min-height:42px;padding:9px 18px;font-size:12px;box-shadow:none;gap:10px}
.hrlp .mobile-nav-cta{display:none}
.hrlp .hero{position:relative;overflow:hidden;background:#fff}
.hrlp .hero-grid{display:grid;grid-template-columns:48% 52%;min-height:605px;align-items:center}
.hrlp .hero-text{padding:75px 0 92px;position:relative;z-index:3}
.hrlp .eyebrow{font-size:14px;font-weight:800;display:flex;gap:11px;align-items:center;margin:0 0 28px;line-height:1.5}
.hrlp .eyebrow:before{content:"";width:27px;height:4px;background:var(--yellow);flex:none}
.hrlp .hero h1{font-size:clamp(34px,3vw,43px);font-weight:900;line-height:1.45;letter-spacing:-.068em;margin:0 0 23px;color:var(--navy)}
.hrlp .hero h1 .unit{display:block;white-space:normal}
.hrlp .hero p.description{font-size:16px;line-height:2;color:var(--body);margin:0 0 33px;max-width:440px}
.hrlp .hero-art{width:100%;height:540px;align-self:center;position:relative;overflow:hidden;display:flex;justify-content:center;align-items:center}
.hrlp .hero-art:after{content:"";position:absolute;pointer-events:none;inset:0;background:linear-gradient(90deg,#fff 0%,rgba(255,255,255,0) 13%),linear-gradient(to top,#fff 0%,rgba(255,255,255,0) 10%)}
.hrlp .hero-art img{width:100%;height:100%;object-fit:contain;max-width:none;filter:saturate(.94);position:relative;z-index:0}
.hrlp .hero-foot{position:absolute;bottom:26px;left:max(48px,calc((100vw - var(--max))/2));font-size:12px;color:#8492a3;letter-spacing:.01em}
.hrlp section.block{padding:100px 0}
.hrlp .tag{font-weight:800;font-size:13px;line-height:1.6;display:flex;align-items:center;gap:11px;margin:0 0 19px;color:#273b57}
.hrlp .tag:before{content:"";height:4px;width:28px;background:var(--yellow);flex:none}
.hrlp h2{font-size:clamp(30px,2.8vw,39px);line-height:1.5;letter-spacing:-.052em;font-weight:850;margin:0;color:var(--navy)}
.hrlp h3{letter-spacing:-.035em;line-height:1.52}
.hrlp .section-intro{font-size:16px;color:var(--body);line-height:2;margin:14px 0 0;max-width:800px}
.hrlp .center-head{text-align:center}
.hrlp .center-head .tag{justify-content:center}
.hrlp .center-head .section-intro{margin:14px auto 0}
.hrlp .headline-gap{margin-bottom:44px}
.hrlp .challenges{border-top:1px solid #f1f3f4}
.hrlp .challenge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.hrlp .challenge{padding:12px 28px 8px;border-right:1px solid var(--line)}
.hrlp .challenge:first-child{padding-left:0}
.hrlp .challenge:last-child{border-right:none;padding-right:0}
.hrlp .challenge-icon{display:grid;place-items:center;width:54px;height:54px;margin-bottom:16px;border-radius:50%;background:var(--ice);color:#368fd7}
.hrlp .challenge-icon svg{width:30px;height:30px}
.hrlp .challenge h3{font-size:19px;font-weight:850;margin:0 0 12px}
.hrlp .challenge p{color:var(--muted);font-size:14px;line-height:1.9;margin:0}
.hrlp .concept{background:var(--soft)}
.hrlp .concept-top{display:grid;grid-template-columns:40% 1fr;gap:74px;align-items:start}
.hrlp .concept-top .section-intro{margin-top:22px}
.hrlp .concept-right{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:14px}
.hrlp .info-card{border-top:3px solid #c5dbed;background:#fff;border-radius:0 0 9px 9px;padding:24px 20px 25px;min-height:244px}
.hrlp .info-card:nth-child(2){border-top-color:var(--yellow)}
.hrlp .info-card .num{font-size:13px;color:#7b8ea0;font-weight:800}
.hrlp .info-card h3{font-size:18px;margin:15px 0 10px;color:var(--navy)}
.hrlp .info-card p{font-size:14px;color:var(--muted);margin:0;line-height:1.85}
.hrlp .concept-bottom{border-top:1px solid #dfe8ee;margin-top:42px;padding-top:25px;font-size:15px;color:#41546a;display:flex;align-items:center;justify-content:space-between;gap:25px}
.hrlp .concept-bottom strong{font-size:17px;color:var(--navy)}
.hrlp .process .process-grid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);margin-top:46px}
.hrlp .process-step{padding:26px 26px 10px 0;position:relative}
.hrlp .process-step:not(:first-child){border-left:1px solid var(--line);padding-left:26px}
.hrlp .process-step .number{font-size:14px;color:#d39a00;font-weight:900;letter-spacing:.04em}
.hrlp .process-step h3{font-size:21px;margin:16px 0 8px}
.hrlp .process-step p{font-size:14px;color:var(--muted);margin:0;line-height:1.9}
.hrlp .process-step ul{padding-left:17px;margin:17px 0 0;color:#536579;font-size:13px;line-height:1.8}
.hrlp .process-step li+li{margin-top:5px}
.hrlp .methods{background:var(--warm)}
.hrlp .methods-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.hrlp .method{background:#fff;padding:28px 30px 30px;border:1px solid #eeeae0;border-radius:10px;min-height:246px}
.hrlp .method .method-mark{font-size:12px;letter-spacing:.08em;font-weight:850;color:#ab8d27}
.hrlp .method h3{font-size:23px;margin:17px 0 14px}
.hrlp .method p{font-size:15px;color:#536478;margin:0 0 12px;line-height:1.85}
.hrlp .method ul{padding-left:18px;margin:0;font-size:14px;color:#5e6d7d;line-height:1.95}
.hrlp .examples-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.hrlp .example{padding:32px 36px;border:1px solid #e3e9ee;border-radius:9px;min-height:260px}
.hrlp .ex-id{font-weight:850;color:#bb9206;font-size:13px;margin:0 0 9px}
.hrlp .example h3{font-size:22px;margin:0 0 15px}
.hrlp .example p{font-size:15px;color:#506074;line-height:2;margin:0 0 20px}
.hrlp .example .detail{padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:#6a7a8c}
.hrlp .note{font-size:13px;line-height:1.85;color:#68788b;margin:23px 0 0}
.hrlp .price{background:#f5f8fb}
.hrlp .price-head{display:flex;align-items:flex-end;justify-content:space-between;gap:25px;margin-bottom:34px}
.hrlp .price-head .section-intro{max-width:670px}
.hrlp .small-action{padding:12px 17px;background:white;border:1px solid #cad6e0;border-radius:7px;white-space:nowrap;color:#18364d;font-weight:750;font-size:13px}
.hrlp .small-action:hover{border-color:#879ab0}
.hrlp .table-scroll{overflow:auto;border-radius:10px;border:1px solid #dfe6ec;background:#fff}
.hrlp table{border-collapse:collapse;width:100%;font-size:15px;table-layout:fixed}
.hrlp thead{background:#eaf1f6}
.hrlp th{text-align:left;color:#263c55;font-size:14px;font-weight:850;padding:17px 22px;letter-spacing:.01em}
.hrlp th:first-child{width:30%}
.hrlp th:nth-child(2){width:51%}
.hrlp th:last-child{width:19%;text-align:right}
.hrlp td{padding:23px 22px;vertical-align:top;border-top:1px solid #e6ebef;line-height:1.75;color:#45596d}
.hrlp td.name{color:var(--navy);font-weight:850;font-size:16px}
.hrlp td.price-value{text-align:right;white-space:nowrap;font-weight:850;color:#1a304c;font-size:22px;letter-spacing:-.045em}
.hrlp td.price-value small{font-size:12px;font-weight:700;letter-spacing:0;color:#687a8f}
.hrlp td .conditions{display:block;font-size:13px;color:#697c8e;margin-top:6px;line-height:1.8}
.hrlp .price-notes{margin-top:21px;font-size:13px;color:#66788c;line-height:1.95;max-width:1060px}
.hrlp .price-notes strong{color:#2d4057}
.hrlp .faq-list{border-top:1px solid var(--line)}
.hrlp .faq-list details{border-bottom:1px solid var(--line)}
.hrlp .faq-list summary{cursor:pointer;list-style:none;padding:21px 44px 21px 0;position:relative;font-weight:750;font-size:16px;line-height:1.8}
.hrlp .faq-list summary::-webkit-details-marker{display:none}
.hrlp .faq-list summary:after{content:"＋";font-size:22px;font-weight:400;color:#6b7c8d;position:absolute;right:8px;top:18px}
.hrlp .faq-list details[open] summary:after{content:"－"}
.hrlp .faq-list details p{padding:0 0 23px 0;margin:0;color:#5c6d7e;font-size:15px;max-width:940px;line-height:2}
.hrlp .start{background:#f9fafc}
.hrlp .start-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:23px}
.hrlp .start-item{border-top:4px solid var(--yellow);padding-top:23px}
.hrlp .start-item .n{font-size:12px;font-weight:850;color:#92802f}
.hrlp .start-item h3{font-size:21px;margin:14px 0 10px}
.hrlp .start-item p{font-size:14px;line-height:2;color:#617185;margin:0}
.hrlp .contact{background:var(--yellow);padding:85px 0 85px}
.hrlp .contact-wrap{display:grid;grid-template-columns:44% 1fr;gap:65px;align-items:start}
.hrlp .contact .tag:before{background:#172b43}
.hrlp .contact h2{font-size:clamp(31px,3vw,41px)}
.hrlp .contact .pitch{font-size:16px;line-height:2;color:#344354;max-width:435px;margin:20px 0 24px}
.hrlp .contact .request-examples{padding-left:20px;color:#344354;font-size:14px;line-height:2}
.hrlp .contact-panel{background:#fff;border-radius:12px;padding:33px 36px 31px;box-shadow:0 14px 33px rgba(63,56,0,.07)}
.hrlp .contact-panel h3{font-size:23px;margin:0 0 7px}
.hrlp .form-lead{font-size:14px;color:#647488;margin:0 0 23px;line-height:1.85}
.hrlp .field{margin-bottom:18px}
.hrlp label{display:block;font-size:13px;font-weight:800;color:#263b54;margin-bottom:8px}
.hrlp input,.hrlp textarea{width:100%;border:1px solid #cbd5dc;border-radius:6px;background:#fff;color:#263b54;padding:12px 14px;font-size:15px;line-height:1.6}
.hrlp textarea{min-height:120px;resize:vertical}
.hrlp input::placeholder,.hrlp textarea::placeholder{color:#98a4af}
.hrlp .field-two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hrlp .form-help{font-size:12px;color:#61748a;line-height:1.85;margin:14px 0 0}
.hrlp .form-feedback{font-size:13px;font-weight:750;min-height:22px;color:#175d43}
.hrlp .send{border:0;background:var(--cta);color:#fff;border-radius:6px;min-height:53px;width:100%;font-weight:850;font-size:15px}
.hrlp .send:hover{background:var(--cta-hover)}
.hrlp .footer{padding:30px 0 90px;background:#fff;color:#677589;font-size:12px}
.hrlp .footer-inner{display:flex;align-items:center;justify-content:space-between;gap:25px}
.hrlp .footer .brand{font-size:20px}
.hrlp .footer a:hover{text-decoration:underline}
.hrlp .footer-right{display:flex;gap:20px;align-items:center}
.hrlp .bottom-cta{display:none}
@media (max-width:1200px){.hrlp .container{width:min(calc(100% - 68px),var(--max))}
.hrlp .nav{gap:18px;font-size:12px}
.hrlp .hero-grid{grid-template-columns:48% 52%}
.hrlp .hero h1{font-size:clamp(34px,3.65vw,46px)}
.hrlp .hero-art img{width:123%}
.hrlp .concept-top{gap:38px}}
@media (max-width:930px){.hrlp .container{width:calc(100% - 50px)}
.hrlp .brand-note{display:none}
.hrlp .nav>a:not(.btn){display:none}
.hrlp .hero-grid{display:block;min-height:0}
.hrlp .hero-text{padding:65px 0 22px}
.hrlp .hero h1{font-size:clamp(36px,5.9vw,54px);max-width:700px}
.hrlp .hero-art{height:450px;width:100%}
.hrlp .hero-art img{width:100%;height:100%;object-fit:contain}
.hrlp .hero-foot{display:none}
.hrlp .concept-top{display:block}
.hrlp .concept-right{margin-top:35px}
.hrlp .challenge-grid{grid-template-columns:repeat(2,1fr);gap:25px}
.hrlp .challenge{border-right:0;border-bottom:1px solid var(--line);padding:16px 18px 26px}
.hrlp .challenge:nth-child(odd){padding-left:0}
.hrlp .challenge:nth-child(even){padding-right:0}
.hrlp .process .process-grid{grid-template-columns:repeat(2,1fr)}
.hrlp .process-step:nth-child(3){border-left:0;padding-left:0;border-top:1px solid var(--line)}
.hrlp .process-step:nth-child(4){border-top:1px solid var(--line)}
.hrlp .methods-grid{grid-template-columns:repeat(2,1fr)}
.hrlp .price-head{align-items:flex-start}
.hrlp .contact-wrap{gap:30px;grid-template-columns:40% 1fr}
.hrlp .contact-panel{padding:27px}}
@media (max-width:640px){.hrlp .container{width:calc(100% - 36px)}
.hrlp header{height:64px}
.hrlp .head{gap:12px}
.hrlp .brand{font-size:23px}
.hrlp .nav{gap:0}
.hrlp .nav .btn{font-size:12px;padding:9px 13px}
.hrlp .nav .btn .arrow{display:none}
.hrlp .hero-text{padding:45px 0 10px}
.hrlp .eyebrow{font-size:12px;margin-bottom:22px}
.hrlp .hero h1{font-size:clamp(30px,7.6vw,39px);line-height:1.5;letter-spacing:-.067em}
.hrlp .hero h1 .unit{white-space:normal}
.hrlp .hero p.description{font-size:15px;margin-bottom:25px}
.hrlp .hero-text>.btn{font-size:14px;min-height:50px}
.hrlp .hero-art{height:auto;aspect-ratio:814/490;margin:7px 0 0}
.hrlp .hero-art img{width:110%;height:auto;max-height:100%;object-fit:contain}
.hrlp .hero-art:after{background:linear-gradient(to bottom,#fff 0%,transparent 7%),linear-gradient(to top,#fff 0%,transparent 7%)}
.hrlp section.block{padding:69px 0}
.hrlp .tag{font-size:12px;margin-bottom:14px}
.hrlp h2{font-size:28px}
.hrlp .section-intro{font-size:14px}
.hrlp .headline-gap{margin-bottom:30px}
.hrlp .challenge-grid{gap:12px}
.hrlp .challenge{padding:5px 10px 25px 0}
.hrlp .challenge:nth-child(even){padding:5px 0 25px 10px}
.hrlp .challenge-icon{height:45px;width:45px}
.hrlp .challenge-icon svg{height:25px;width:25px}
.hrlp .challenge h3{font-size:16px}
.hrlp .challenge p{font-size:13px}
.hrlp .concept-right{grid-template-columns:1fr;gap:9px}
.hrlp .info-card{min-height:0;padding:20px 21px 21px}
.hrlp .info-card h3{font-size:17px;margin:8px 0}
.hrlp .info-card p{font-size:14px}
.hrlp .concept-bottom{display:block}
.hrlp .concept-bottom strong{display:block;margin-bottom:9px}
.hrlp .process .process-grid{grid-template-columns:1fr;margin-top:30px}
.hrlp .process-step,.hrlp .process-step:not(:first-child),.hrlp .process-step:nth-child(3),.hrlp .process-step:nth-child(4){border-left:0;border-top:1px solid var(--line);padding:18px 0 24px}
.hrlp .process-step:first-child{border-top:0}
.hrlp .process-step h3{font-size:20px;margin:8px 0}
.hrlp .methods-grid,.hrlp .examples-grid,.hrlp .start-grid{grid-template-columns:1fr;gap:12px}
.hrlp .method{padding:24px;min-height:0}
.hrlp .method h3{font-size:21px}
.hrlp .example{padding:26px 23px;min-height:0}
.hrlp .example h3{font-size:20px}
.hrlp .example p{font-size:14px}
.hrlp .price-head{display:block;margin-bottom:22px}
.hrlp .small-action{margin-top:18px}
.hrlp .table-scroll{border:0;overflow:visible;background:transparent}
.hrlp table,.hrlp tbody,.hrlp tr,.hrlp td{display:block}
.hrlp thead{display:none}
.hrlp tr{background:#fff;border:1px solid #e0e6eb;border-radius:9px;margin-bottom:13px;padding:22px}
.hrlp td{border:0;padding:0}
.hrlp td.name{font-size:17px;margin-bottom:11px}
.hrlp td.description{font-size:14px;line-height:1.85}
.hrlp td.price-value{text-align:left;font-size:22px;margin-top:16px;padding-top:14px;border-top:1px solid #e8edf0}
.hrlp .price-notes{font-size:12px}
.hrlp .faq-list summary{font-size:15px}
.hrlp .start-item{padding:16px 0 20px}
.hrlp .contact{padding:60px 0 80px}
.hrlp .contact-wrap{display:block}
.hrlp .contact h2{font-size:29px}
.hrlp .contact-panel{padding:25px 20px;margin-top:30px}
.hrlp .contact-panel h3{font-size:20px}
.hrlp .field-two{grid-template-columns:1fr;gap:0}
.hrlp .footer{padding-bottom:88px}
.hrlp .footer-inner{display:block}
.hrlp .footer-right{margin-top:14px}
.hrlp .bottom-cta{position:fixed;z-index:101;bottom:0;left:0;right:0;padding:9px 15px calc(9px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:block}
.hrlp .bottom-cta a{display:flex;align-items:center;justify-content:center;background:var(--cta);font-weight:850;color:#fff;min-height:47px;border-radius:7px;font-size:14px}}
@media print{.hrlp header,.hrlp .bottom-cta,.hrlp .small-action,.hrlp .btn,.hrlp .contact,.hrlp .footer{display:none!important}
.hrlp .hero{min-height:0}
.hrlp .hero-grid{min-height:0}
.hrlp .hero-art{height:250px}
.hrlp section.block{padding:22px 0;break-inside:avoid}
.hrlp .price{break-before:page}
.hrlp .table-scroll{overflow:visible}
.hrlp table{table-layout:auto}
.hrlp td,.hrlp th{font-size:11px;padding:10px}
.hrlp .container{width:96%}}
@media (prefers-reduced-motion:reduce){.hrlp .btn{transition:none}}
/* LP内のみ適用：BlueMonkey標準テンプレートのスタイルと分離 */
.hrlp{--ink:#162641;--navy:#142746;--body:#39495e;--muted:#65758a;--yellow:#ffdb31;--yellow2:#f9ce18;--cta:#c73438;--cta-hover:#aa292e;--line:#e4e9ee;--soft:#f6f9fb;--ice:#eff7ff;--warm:#fffdf5;--max:1180px;--radius:10px;color:var(--ink);font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,Arial,sans-serif;line-height:1.8;font-size:16px;-webkit-font-smoothing:antialiased;width:100%;}
.hrlp *{box-sizing:border-box}
.hrlp .bn-contact-wrap{display:block;max-width:800px;margin-inline:auto;text-align:center}
.hrlp .bn-contact-wrap .request-examples{display:inline-block;text-align:left;}
.hrlp .bn-contact-intro{padding-bottom:32px}
.hrlp .bn-form-outer{max-width:820px;padding-top:0;padding-bottom:100px;}
.hrlp .bn-form-shell{padding:clamp(22px,4vw,46px);background:#fff;border:1px solid #e1e7ee;border-radius:15px;box-shadow:0 18px 48px rgba(14,45,85,.06);}
.hrlp .bn-form-heading{font-size:clamp(20px,2.1vw,27px);margin:0 0 20px;font-weight:750;letter-spacing:.015em;color:#142746;}
.hrlp .bn-form-preview-notice{padding:28px 18px;color:#53647b;background:#f5f8fc;border:1px dashed #cbd6e1;border-radius:10px;text-align:center;}
.hrlp .bn-form-preview-notice p{margin:0 0 8px}
.hrlp .bn-form-preview-notice small{font-size:13px}
