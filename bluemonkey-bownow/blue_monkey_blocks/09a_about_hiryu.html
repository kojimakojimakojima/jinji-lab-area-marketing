<section class="block about-profiles" id="about"><div class="container"><div class="about-grid">
<article class="about-profile"><p class="tag">人事ラボとは</p><h2>自社を主語に、<br/>採用を考える。</h2><p class="about-body">人事ラボは、データや求職者の声、さまざまな問いを手がかりに、自社の採用を捉え、納得できる答えを見つけるためのメディアです。</p></article>
<article class="about-profile"><p class="tag">飛竜企画とは</p><h2>採用の現場に向き合う人の、<br/>意思ある選択と実行を支える。</h2><p class="about-body">飛竜企画は、お客さま自身もまだ言葉にできていない採用の実態を深く理解し、お客さまが納得して次の一手を決められるようにする会社です。</p><p class="about-note">1974年設立。求人広告、採用企画、制作、採用業務のアウトソーシングなど、採用活動の実行も支援しています。</p></article>
</div></div></section>
