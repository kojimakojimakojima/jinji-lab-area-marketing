<section class="block concept" id="approach"><div class="container"><div class="concept-top"><div><p class="tag">エリア採用の考え方</p><h2>地域の条件から<br/>採用方法を考えます。</h2><p class="section-intro">同じ沿線でも、通える範囲や求職者が重視する条件は異なります。採用したい拠点の周辺を確認し、適した方法を検討します。</p></div><div class="concept-right"><article class="info-card"><span class="num">01 / 通える</span><h3>通勤圏を知る</h3><p>交通手段、通勤時間、生活動線を確認します。</p></article><article class="info-card"><span class="num">02 / 働ける</span><h3>働く条件を知る</h3><p>時間帯、日数、給与などを近隣求人と比較します。</p></article><article class="info-card"><span class="num">03 / 選ばれる</span><h3>仕事の魅力を知る</h3><p>現場取材から、業務や職場環境を具体的に伝えます。</p></article></div></div><div class="concept-bottom"><strong>募集の範囲も、伝える内容も、拠点ごとに検討します。</strong><span>一括運用の利点を生かしながら、採用が難しい拠点を重点的に支援します。</span></div></div></section>
